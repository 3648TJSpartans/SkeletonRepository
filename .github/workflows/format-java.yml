name: Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Download google-java-format
      - name: Download google-java-format
        run: |
          VERSION="1.28.0"
          curl -L -o google-java-format.jar https://github.com/google/google-java-format/releases/download/v$VERSION/google-java-format-$VERSION-all-deps.jar

      # Step 4: Format Java files
      - name: Format Java files
        run: |
          find . -name "*.java" -exec java -jar google-java-format.jar --replace {} +

      # Step 5: Commit and push changes (if any)
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Action: Format Java files" || echo "No changes to commit"
          git push
